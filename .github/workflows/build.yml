name: Build MiSTer Companion AppImages

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

env:
  UPSTREAM_REPO: Anime0t4ku/mister-companion

permissions:
  contents: write

concurrency:
  group: build-appimages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest upstream release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${UPSTREAM_REPO}/releases/latest" > upstream-release.json
          echo "tag=$(jq -r .tag_name upstream-release.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether we already have this release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.latest.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "already have release ${{ steps.latest.outputs.tag }}, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream Linux binaries
        if: steps.check.outputs.exists == 'false'
        run: |
          x86_64_url=$(jq -r '.assets[] | select(.name=="MiSTer-Companion-Linux-x86_64.tar.gz") | .browser_download_url' upstream-release.json)
          arm64_url=$(jq -r '.assets[] | select(.name=="MiSTer-Companion-Linux-ARM64.tar.gz") | .browser_download_url' upstream-release.json)

          mkdir -p extracted/x86_64 extracted/arm64
          curl -sL -o x86_64.tar.gz "$x86_64_url"
          curl -sL -o arm64.tar.gz "$arm64_url"
          tar -xzf x86_64.tar.gz -C extracted/x86_64
          tar -xzf arm64.tar.gz -C extracted/arm64

      - name: Build AppImages
        if: steps.check.outputs.exists == 'false'
        run: |
          chmod +x scripts/make-appimage.sh
          scripts/make-appimage.sh extracted/x86_64/MiSTer-Companion x86_64 MiSTer-Companion-Linux-x86_64.AppImage "${{ github.repository }}" "${{ steps.latest.outputs.tag }}"
          scripts/make-appimage.sh extracted/arm64/MiSTer-Companion aarch64 MiSTer-Companion-Linux-ARM64.AppImage "${{ github.repository }}" "${{ steps.latest.outputs.tag }}"
          chmod +x MiSTer-Companion-Linux-x86_64.AppImage MiSTer-Companion-Linux-ARM64.AppImage

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "> **Note:** This release was automatically generated by this repository's GitHub Action and is not an official MiSTer Companion release. It repackages the official upstream Linux binaries as AppImages."
            echo
            jq -r .body upstream-release.json
          } > release-notes.md

          gh release create "${{ steps.latest.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "$(jq -r .name upstream-release.json)" \
            --notes-file release-notes.md \
            MiSTer-Companion-Linux-x86_64.AppImage \
            MiSTer-Companion-Linux-x86_64.AppImage.zsync \
            MiSTer-Companion-Linux-ARM64.AppImage \
            MiSTer-Companion-Linux-ARM64.AppImage.zsync
